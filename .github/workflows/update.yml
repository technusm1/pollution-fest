name: update

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours; FIRMS NRT lands ~3h after each overpass
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start UTC date (YYYY-MM-DD). Empty = last 3 days."
        required: false
      to:
        description: "Backfill end UTC date (YYYY-MM-DD). Empty = today."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Fetch FIRMS detections
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -n "${{ inputs.from }}" ]; then
            go run ./cmd/paraliwatch fetch --from "${{ inputs.from }}" ${{ inputs.to && format('--to {0}', inputs.to) || '' }}
          else
            go run ./cmd/paraliwatch fetch --days 3
          fi

      - name: Commit raw data
        run: |
          git config user.name "paraliwatch-bot"
          git config user.email "paraliwatch-bot@users.noreply.github.com"
          git add data/fires
          git diff --cached --quiet || git commit -m "data: FIRMS update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build site
        run: go run ./cmd/paraliwatch build --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
